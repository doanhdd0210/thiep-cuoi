<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Link mời nhà trai</title>
<style>
:root{--bg:#faf6f2;--card:#fff;--ink:#2b2420;--muted:#8a7d74;--line:#eadfd6;--ac:#b5524a;--ok:#2f7d57;--oks:#e1f1e8}
@media(prefers-color-scheme:dark){:root{--bg:#17130f;--card:#231d18;--ink:#f2e9e1;--muted:#a89a8f;--line:#3a312a;--ac:#e0867d;--ok:#6fcf9c;--oks:#1d3228}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 14px 10px;z-index:5}
h1{margin:0 0 6px;font-size:19px}.cnt{color:var(--muted);font-size:14px;margin-bottom:8px}.cnt b{color:var(--ok);font-size:20px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:10px 14px 60px;max-width:720px;margin:0 auto}
.row{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row.sent{border-color:var(--ok);background:var(--oks)}
.n{font-weight:600}.g{font-size:12px;color:var(--muted)}
.b{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.b button,.b a{font:inherit;font-size:13.5px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:6px 12px;text-decoration:none}
.b .on{background:var(--ok);border-color:var(--ok);color:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<header><h1>Link mời nhà trai</h1><div class="cnt"><b id="s">0</b> / <span id="t">0</span> đã gửi</div>
<input id="q" type="search" placeholder="Tìm tên…" autocomplete="off"><div class="tabs" id="tabs"></div></header>
<main id="list"></main><div class="toast" id="toast"></div>
<script>
var G=[[1, "Anh em họ", "Em Hồng"], [2, "Bạn cấp 3", "Bạn Độ và vợ"], [3, "Bạn cấp 3", "Lệ Chi"], [4, "Bạn cấp 3", "Trịnh Công Son"], [5, "Bạn cấp 3", "Nguyễn Ánh"], [6, "Bạn cấp 3", "Vũ Hoàng Vũ"], [7, "Bạn cấp 3", "Ngô Xuân Thịnh"], [8, "Synodus", "Nguyễn Tiến Toàn"], [9, "Bạn cấp 3", "Ngô Mạnh Long"], [10, "Bạn cấp 3", "Hường Lã"], [11, "Trong thôn", "Ngô Xuân Trường"], [12, "Trong thôn", "Đoàn Trường"], [13, "Bạn cấp 3", "Dao Dinh Khải"], [14, "Bạn cấp 3", "Tiến Dũng"], [15, "Bạn cấp 3", "Nguyễn Đình Thuận"], [16, "Bạn cấp 3", "Trần Trung Hiếu"], [17, "Bạn cấp 3", "Đoàn Văn Lộc"], [18, "Trong thôn", "Do Quang Ha"], [19, "Bạn cấp 3", "Nguyễn Phúc Du"], [20, "Bạn cấp 3", "Trung Kiên"], [21, "Trong thôn", "Đỗ Quang Nam"], [22, "Bạn cấp 3", "Nguyễn Luân"], [23, "Bạn đại học", "Cảnh"], [24, "Anh em họ", "Phú Hiệp"], [25, "Synodus", "Nguyễn Thành Nam"], [26, "Bạn cấp 3", "Đào Minh Trí"], [27, "Bạn đại học", "Duy Vũ"], [28, "Trong thôn", "Nguyễn Ngọc TrườnG"], [29, "Bạn cấp 3", "Đ. V. MạnH"], [30, "Bạn cấp 3", "Quỳnh Laser"], [31, "Synodus", "Hoang Dinh"], [32, "Bạn cấp 3", "Kim Việt"], [33, "Bạn cấp 3", "Trần Đình Lượng"], [34, "Synodus", "Thúy Thương"], [35, "Trong thôn", "Nguyễn Gia Hiệp"], [36, "Trong thôn", "Xuân Tùng"], [37, "Trong thôn", "Hải Nguyễn"], [38, "Bạn đại học", "Hà Ngọc Lực"], [39, "Trong thôn", "Trần Đình Tiến"], [40, "Synodus", "Hưng Nguyễn"], [41, "Synodus", "Tô Văn Hưng"], [42, "Synodus", "Văn Nam"], [43, "Bạn đại học", "Nguyễn Đăng Bách"], [44, "Bạn đại học", "Dang Xuan Tùng"], [45, "Bạn đại học", "Khuất Minh"], [46, "Synodus", "Lưu Mạnh Quân"], [47, "Synodus", "Phạm Hải"], [48, "Bạn đại học", "Lê Phương"], [49, "Bạn cấp 3", "Nam Phạm"], [50, "Bạn cấp 3", "Mai Tuân Hưng"], [51, "Panasonic", "Phương Việt Hoàng"], [52, "Panasonic", "Phùng Đức Tuấn"], [53, "Trong thôn", "Thắng Nguyễn"], [54, "Synodus", "Nguyễn Thị Lan Anh"], [55, "Panasonic", "Bạn Quang"], [56, "Panasonic", "Anh Thương"], [57, "Panasonic", "Anh Thảo"], [58, "Panasonic", "Anh Thoả"], [59, "Panasonic", "Anh Sang"], [60, "Panasonic", "Anh Đạt"], [61, "Panasonic", "Anh Đức"], [62, "Panasonic", "Anh Đức Béo"], [63, "Panasonic", "Anh Thuật"], [64, "Panasonic", "Anh Lộc"], [65, "Panasonic", "Anh Hiểu"], [66, "Panasonic", "Anh Tùng"], [67, "Panasonic", "Anh Nam"], [68, "Panasonic", "Anh Nam Bé"], [69, "Panasonic", "Anh Duy"], [70, "Panasonic", "Anh Tùng (2)"], [71, "Panasonic", "Anh Được"], [72, "Panasonic", "Anh Phương"], [73, "Panasonic", "Em Vũ"], [74, "Panasonic", "Chị Nhung"], [75, "Panasonic", "Chị Thu"], [76, "Panasonic", "Anh Đắc"], [77, "Panasonic", "Anh Mạnh"], [78, "Panasonic", "Anh Thiện"], [79, "Panasonic", "Anh Hoàng"], [80, "Panasonic", "Anh Ngọc"], [81, "Panasonic", "Anh Tuân"], [82, "Anh em họ", "Em Thư"], [83, "Anh em họ", "Anh Hưng"], [84, "Anh em họ", "Anh Hiển"], [85, "Anh em họ", "Anh Hiếu"], [86, "Anh em họ", "Chị Loan"], [87, "Anh em họ", "Chị Linh"], [88, "Anh em họ", "Em Hiếu"], [89, "Bạn cấp 3", "Vân"], [90, "Synodus", "Thị Ánh"]];
var K='ds-trai-sent-v1',sent={};try{sent=JSON.parse(localStorage.getItem(K)||'{}')||{}}catch(e){}
var NK='ds-trai-names-v1',names={};try{names=JSON.parse(localStorage.getItem(NK)||'{}')||{}}catch(e){}
var BASE='https://doanhdd0210.github.io/thiep-cuoi/';
var MK='ds-trai-meal-v1',meal={};try{meal=JSON.parse(localStorage.getItem(MK)||'{}')||{}}catch(e){}
function parseMeal(s){s=(s||'').trim();if(!s)return null;var m=/^(\d{1,2})(?:\/11)?[\s,;-]+(\d{1,2})(?:[:h.](\d{1,2})?)?$/.exec(s);if(!m)return null;var d=+m[1],h=+m[2],mi=m[3]?+m[3]:0;if(d<10||d>30||h>23||mi>59)return null;return{d:d,t:(h<10?'0':'')+h+':'+(mi<10?'0':'')+mi}}
function dn(r){return names[r[0]]||r[2]}
function lk(r){var m=meal[r[0]];return BASE+'?to='+encodeURIComponent(dn(r).replace(/\s*\(\d+\)$/,''))+(m?'&gio='+m.t+'&ngay='+m.d:'&gio=10:00&ngay=29')+'&v=2'}
var f='all',q='',$=function(i){return document.getElementById(i)};
var ORD=["Trong thôn", "Bạn cấp 3", "Bạn đại học", "Synodus", "Anh em họ", "Họ nội", "Họ ngoại", "Panasonic", "Chưa phân"],groups=ORD.filter(function(g){return G.some(function(r){return r[1]===g})});
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase()}
function save(){try{localStorage.setItem(K,JSON.stringify(sent));localStorage.setItem(NK,JSON.stringify(names));localStorage.setItem(MK,JSON.stringify(meal))}catch(e){}}
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},1600)}
function copy(txt){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('Đã copy link')},function(){var a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Đã copy link')})}
function render(){
  var n=G.filter(function(r){return sent[r[0]]}).length;$('s').textContent=n;$('t').textContent=G.length;
  var tb=$('tabs');tb.textContent='';
  ['all'].concat(groups).forEach(function(g){var b=document.createElement('button');b.dataset.f=g;if(g===f)b.className='on';
    var c=G.filter(function(r){return g==='all'||r[1]===g});b.textContent=(g==='all'?'Tất cả':g)+' '+c.filter(function(r){return sent[r[0]]}).length+'/'+c.length;tb.appendChild(b)});
  var l=$('list');l.textContent='';var qq=norm(q.trim());
  G.filter(function(r){return(f==='all'||r[1]===f)&&(!qq||(norm(dn(r)).indexOf(qq)>=0||norm(r[2]).indexOf(qq)>=0))}).forEach(function(r){
    var d=document.createElement('div');d.className='row'+(sent[r[0]]?' sent':'');d.dataset.id=r[0];
    d.innerHTML='<div class="n"></div><div class="g"></div><div class="b"><button data-a="c">🔗 Copy link</button><a target="_blank" rel="noopener">↗ Mở</a><button data-a="s"></button><button data-a="e">✎ Sửa tên</button><button data-a="m">🕒 Ngày giờ tiệc</button></div>';
    d.querySelector('.n').textContent=dn(r);d.querySelector('.g').textContent=r[1]+(dn(r)!==r[2]?' · gốc: '+r[2]:'')+(meal[r[0]]?' · tiệc '+meal[r[0]].d+'/11 lúc '+meal[r[0]].t:'');d.querySelector('a').href=lk(r);
    var s=d.querySelector('[data-a=s]');s.textContent=sent[r[0]]?'✓ Đã gửi':'Đánh dấu đã gửi';if(sent[r[0]])s.className='on';
    l.appendChild(d)})}
$('list').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var id=+b.closest('.row').dataset.id;
  var r=G.filter(function(x){return x[0]===id})[0];
  if(b.dataset.a==='c')copy(lk(r));else if(b.dataset.a==='e'){var v=prompt('Tên hiện trên thiệp (vd: "Tiến và bạn gái"). Để trống = về tên gốc "'+r[2]+'":',dn(r));if(v===null)return;v=v.trim();if(!v||v===r[2])delete names[id];else names[id]=v;save();render()}else if(b.dataset.a==='m'){var cur=meal[id]?meal[id].d+' '+meal[id].t:'';var s=prompt('Ngày giờ tiệc chính của người này (vd: 28 10:00 hoặc 29 15:00). Để trống = mặc định 29 10:00:',cur);if(s===null)return;if(!s.trim()){delete meal[id]}else{var pm=parseMeal(s);if(!pm){alert('Chưa đúng dạng. Gõ ngày rồi giờ, vd: 28 10:00');return}meal[id]=pm}save();render()}else{if(sent[id])delete sent[id];else sent[id]=1;save();render()}});
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b){f=b.dataset.f;render()}});
$('q').addEventListener('input',function(e){q=e.target.value;render()});
render();
</script></body></html>
